overrides:
  '@babel/core': 7.29.6
  form-data: 4.0.6
  js-yaml: 4.3.0
  postcss: 8.5.18
  # next 16.2.11 declares sharp ^0.34.5, which excludes the patched 0.35.0, so
  # no upstream bump can reach the fix -- force it here.
  sharp: 0.35.0
  # Two independent major branches reach this package: minimatch@3 pulls 1.x,
  # minimatch@10 pulls 5.x. Each branch needs its own patched version.
  'brace-expansion@1': 1.1.16
  'brace-expansion@5': 5.0.7

allowBuilds:
  sharp: true
  unrs-resolver: true
